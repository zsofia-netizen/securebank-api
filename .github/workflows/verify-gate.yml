name: verify-gate (prueba de bloqueo)

# Sirve para EVIDENCIAR el bloqueo: ejecútalo a mano con una imagen NO firmada
# (por ejemplo un tag que subiste sin firmar) y el pipeline debe quedar en ROJO.
on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Imagen a verificar, preferible por digest (ghcr.io/<owner>/<repo>/securebank@sha256:...)"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Verificar firma
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ inputs.image_ref }}" || exit 1
